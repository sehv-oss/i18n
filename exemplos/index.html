<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@sehv-oss/i18n — Examples</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="logo">
          <h1>@sehv-oss/i18n</h1>
          <span class="badge">examples</span>
        </div>

        <nav>
          <button class="nav-item active" data-example="usando-o-core">
            <span class="nav-icon">⚡</span>
            <div class="nav-text">
              <span class="nav-title">Core</span>
              <span class="nav-desc">Vanilla JS/TS usage</span>
            </div>
          </button>
          <button class="nav-item" data-example="criando-um-loader-de-yaml">
            <span class="nav-icon">📄</span>
            <div class="nav-text">
              <span class="nav-title">YAML Loader</span>
              <span class="nav-desc">Custom loader plugin</span>
            </div>
          </button>
          <button class="nav-item" data-example="usando-react">
            <span class="nav-icon">⚛️</span>
            <div class="nav-text">
              <span class="nav-title">React</span>
              <span class="nav-desc">Hooks & Components</span>
            </div>
          </button>
        </nav>

        <div class="sidebar-footer">
          <a
            href="https://github.com/sehv-oss/i18n"
            target="_blank"
            class="github-link"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              />
            </svg>
            GitHub
          </a>
        </div>
      </aside>

      <main class="content">
        <iframe id="example-frame" src="./usando-o-core/index.html"></iframe>
      </main>
    </div>

    <script>
      const frame = document.getElementById('example-frame');
      const buttons = document.querySelectorAll('.nav-item');

      function resizeFrame() {
        if (window.innerWidth >= 768) return;
        try {
          const body = frame.contentDocument?.body;
          const html = frame.contentDocument?.documentElement;
          if (body && html) {
            const height = Math.max(body.scrollHeight, html.scrollHeight);
            frame.style.height = height + 'px';
          }
        } catch (_) {
          /* cross-origin guard */
        }
      }

      frame.addEventListener('load', resizeFrame);
      window.addEventListener('resize', () => {
        if (window.innerWidth >= 768) {
          frame.style.height = '';
        } else {
          resizeFrame();
        }
      });

      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const example = btn.dataset.example;
          frame.src = `./${example}/index.html`;

          buttons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    </script>
  </body>
</html>
