<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@sehv-oss/i18n — Core Example</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>@sehv-oss/i18n — Core</h1>
        <p class="subtitle" id="subtitle"></p>
        <div class="locale-switcher">
          <button class="locale-btn active" data-locale="en">English</button>
          <button class="locale-btn" data-locale="pt-BR">Português</button>
          <button class="locale-btn" data-locale="es">Español</button>
        </div>
      </header>

      <main>
        <section class="card">
          <h2>🔤 Translate</h2>
          <div class="result">
            <span class="label">greeting:</span>
            <span id="greeting"></span>
          </div>
          <div class="result">
            <span class="label">items (1):</span>
            <span id="items-one"></span>
          </div>
          <div class="result">
            <span class="label">items (5):</span>
            <span id="items-many"></span>
          </div>
        </section>

        <section class="card">
          <h2>🔢 Format Number</h2>
          <div class="result">
            <span class="label">1234567.89:</span>
            <span id="number"></span>
          </div>
        </section>

        <section class="card">
          <h2>💰 Format Currency</h2>
          <div class="result">
            <span class="label">USD 1499.99:</span>
            <span id="currency-usd"></span>
          </div>
          <div class="result">
            <span class="label">BRL 1499.99:</span>
            <span id="currency-brl"></span>
          </div>
        </section>

        <section class="card">
          <h2>📅 Format Date</h2>
          <div class="result">
            <span class="label">long:</span>
            <span id="date-long"></span>
          </div>
          <div class="result">
            <span class="label">short:</span>
            <span id="date-short"></span>
          </div>
        </section>

        <section class="card">
          <h2>📋 Format List</h2>
          <div class="result">
            <span class="label">conjunction:</span>
            <span id="list"></span>
          </div>
        </section>

        <section class="card">
          <h2>⏱️ Format Relative Time</h2>
          <div class="result">
            <span class="label">-2 days:</span>
            <span id="relative-past"></span>
          </div>
          <div class="result">
            <span class="label">+3 hours:</span>
            <span id="relative-future"></span>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
